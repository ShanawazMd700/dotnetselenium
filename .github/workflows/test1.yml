name: .NET Selenium CI (Windows)
permissions:
  contents: write

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'TestResults/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  #schedule:
    # Run at 3 AM IST daily -> 21:30 UTC previous day
    #- cron: '30 21 * * *'


jobs:
  build-test:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
         fetch-depth: 0
         token: ${{ secrets.GITHUB_TOKEN }}

      #  Step 2: Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'  

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Step 4: Build solution
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      # Step 5: Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      # Step 6: Setup ChromeDriver
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v1
        with:
          version: latest

      # Step 7: Run Tests (NUnit or ReqnRoll)
      - name: Run ReqnRoll Selenium Tests
        run: dotnet test --configuration Release --logger "console;verbosity=detailed" | tee TestResults.log

      # Step 8: Upload Test Results and Extent Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_ExtentReports
          path: |
            TestResults/**/*
             TestResults.log
       # Step 9: Commit and push reports to repo (without triggering loop)      
      - name: Commit Reports to Repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add TestResults
          git diff-index --quiet HEAD || git commit -m "Update Extent Report from CI run [skip ci]"
          git push
    env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
